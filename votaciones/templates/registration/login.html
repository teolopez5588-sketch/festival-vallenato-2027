
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Festival Vallenato 2027</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #edf1f6;
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
        }

        .contenedor {
            background: white;
            padding: 32px;
            border-radius: 12px;
            width: min(420px, 92%);
            box-shadow: 0 8px 25px #102b4e18;
        }

        h1 { color: #102b4e; }

        input {
            width: 100%;
            padding: 10px;
            margin: 6px 0 14px;
            border: 1px solid #ccd4df;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #102b4e;
            color: white;
            border: 0;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .errorlist { color: #b42318; }
        a { color: #176b87; }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>Iniciar sesión</h1>
        <p>Ingresa con tu usuario y contraseña.</p>

        {% if form.errors %}
            <p style="color:#b42318;">
                No se pudo iniciar sesión. Verifica tus datos.
            </p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Ingresar</button>
        </form>

        <p>¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate</a></p>
        <p><a href="/">Volver al inicio</a></p>
    </div>
</body>
</html>
